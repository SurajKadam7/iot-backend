<!doctype html>
<html lang="en" data-theme="fluxera" data-radius="default" data-density="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="dark light" />
    <title>Fluxera</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      try {
        var raw = localStorage.getItem("fluxera-appearance");
        var appearance = raw ? (raw.charAt(0) === "{" ? JSON.parse(raw) : { theme: raw }) : {};
        var theme = appearance.theme === "fluxera-light" ? "fluxera-light" : "fluxera";
        var radius = appearance.radius === "round" || appearance.radius === "sharp" ? appearance.radius : "default";
        var density = appearance.density === "compact" || appearance.density === "comfortable" ? appearance.density : "default";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-radius", radius);
        root.setAttribute("data-density", density);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
